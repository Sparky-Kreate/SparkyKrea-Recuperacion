<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SparkyKrea — Restablecer contraseña</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            min-height:100vh;
            background:
                radial-gradient(
                    circle at top,
                    #25201a 0%,
                    #11100f 42%,
                    #090909 100%
                );
            color:#f5f1e8;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:480px;
        }

        .card{
            background:
                rgba(25,23,20,.96);
            border:1px solid rgba(212,175,55,.28);
            border-radius:24px;
            padding:34px 28px;
            box-shadow:
                0 20px 70px rgba(0,0,0,.55),
                0 0 40px rgba(212,175,55,.05);
        }

        .logo{
            text-align:center;
            margin-bottom:30px;
        }

        .logo h1{
            font-family:
                Georgia,
                "Times New Roman",
                serif;
            font-size:32px;
            letter-spacing:1px;
            color:#d4af37;
        }

        .logo p{
            margin-top:7px;
            color:#aaa49a;
            font-size:13px;
        }

        .icon{
            width:72px;
            height:72px;
            margin:0 auto 22px;
            border-radius:50%;
            border:1px solid rgba(212,175,55,.45);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#d4af37;
            font-size:30px;
            background:
                rgba(212,175,55,.06);
        }

        h2{
            text-align:center;
            font-family:
                Georgia,
                "Times New Roman",
                serif;
            font-size:28px;
            margin-bottom:10px;
        }

        .description{
            text-align:center;
            color:#aaa49a;
            font-size:14px;
            line-height:1.6;
            margin-bottom:28px;
        }

        .form{
            display:none;
        }

        .form.active{
            display:block;
        }

        .field{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:13px;
            color:#d9d3c8;
        }

        input{
            width:100%;
            padding:14px 15px;
            border-radius:12px;
            border:1px solid #39352f;
            background:#11100f;
            color:#fff;
            outline:none;
            font-size:15px;
            transition:.2s;
        }

        input:focus{
            border-color:#d4af37;
            box-shadow:
                0 0 0 3px rgba(212,175,55,.09);
        }

        .button{
            width:100%;
            border:none;
            border-radius:12px;
            padding:15px;
            background:#d4af37;
            color:#111;
            font-weight:bold;
            font-size:15px;
            cursor:pointer;
            transition:.2s;
            margin-top:6px;
        }

        .button:hover{
            background:#e2c15a;
            transform:translateY(-1px);
        }

        .button:disabled{
            opacity:.6;
            cursor:not-allowed;
            transform:none;
        }

        .message{
            display:none;
            margin-top:20px;
            padding:14px;
            border-radius:12px;
            font-size:13px;
            line-height:1.5;
            text-align:center;
        }

        .message.show{
            display:block;
        }

        .message.error{
            background:rgba(180,45,45,.12);
            border:1px solid rgba(220,80,80,.3);
            color:#ffb0b0;
        }

        .message.success{
            background:rgba(55,150,90,.12);
            border:1px solid rgba(80,190,120,.3);
            color:#a9efbf;
        }

        .message.info{
            background:rgba(212,175,55,.08);
            border:1px solid rgba(212,175,55,.22);
            color:#e5d69e;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:25px;
            color:#d4af37;
            text-decoration:none;
            font-size:13px;
        }

        .back:hover{
            text-decoration:underline;
        }

        .loading{
            text-align:center;
            padding:10px 0 5px;
        }

        .spinner{
            width:34px;
            height:34px;
            border:3px solid rgba(212,175,55,.2);
            border-top-color:#d4af37;
            border-radius:50%;
            animation:
                spin .8s linear infinite;
            margin:0 auto 16px;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }

        .footer{
            text-align:center;
            color:#69655e;
            font-size:11px;
            margin-top:20px;
        }

        @media(max-width:480px){

            body{
                padding:14px;
            }

            .card{
                padding:28px 20px;
                border-radius:20px;
            }

            .logo h1{
                font-size:28px;
            }

            h2{
                font-size:24px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">

                <h1>SparkyKrea</h1>

                <p>
                    Recuperación de cuenta
                </p>

            </div>


            <!-- ESTADO DE CARGA -->

            <div
                id="loadingSection"
                class="loading"
            >

                <div class="icon">
                    🔐
                </div>

                <h2>
                    Restablecer contraseña
                </h2>

                <p class="description">
                    Estamos verificando el enlace de recuperación...
                </p>

                <div class="spinner"></div>

            </div>


            <!-- FORMULARIO -->

            <div
                id="resetSection"
                class="form"
            >

                <div class="icon">
                    🔑
                </div>

                <h2>
                    Nueva contraseña
                </h2>

                <p class="description">
                    Escribe una nueva contraseña para tu cuenta de SparkyKrea.
                </p>


                <div class="field">

                    <label for="newPassword">
                        Nueva contraseña
                    </label>

                    <input
                        id="newPassword"
                        type="password"
                        placeholder="Escribe tu nueva contraseña"
                        autocomplete="new-password"
                    >

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        placeholder="Repite tu nueva contraseña"
                        autocomplete="new-password"
                    >

                </div>


                <button
                    id="saveButton"
                    class="button"
                    type="button"
                    onclick="updatePassword()"
                >
                    Guardar nueva contraseña
                </button>


                <div
                    id="message"
                    class="message"
                ></div>

            </div>


            <!-- ENLACE PARA VOLVER -->

            <a
                class="back"
                href="https://sparky-kreate.github.io/SparkyKreate/"
            >
                ← Volver a SparkyKrea
            </a>

        </div>


        <div class="footer">
            © SparkyKrea
        </div>

    </div>


<script>

    /*
    ==========================================
    CONFIGURACIÓN SUPABASE
    ==========================================
    */

    const SUPABASE_URL =
        "https://lvsntxkywjyxumlgtayl.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_bhzMbxUHakbytVuVlNcz8A_f2f6szGA";


    /*
    ==========================================
    CREAR CLIENTE SUPABASE
    ==========================================
    */

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth:{
                    detectSessionInUrl:true,
                    persistSession:true,
                    autoRefreshToken:true
                }
            }
        );


    /*
    ==========================================
    ELEMENTOS
    ==========================================
    */

    const loadingSection =
        document.getElementById(
            "loadingSection"
        );

    const resetSection =
        document.getElementById(
            "resetSection"
        );

    const messageBox =
        document.getElementById(
            "message"
        );

    const saveButton =
        document.getElementById(
            "saveButton"
        );


    /*
    ==========================================
    MOSTRAR MENSAJE
    ==========================================
    */

    function showMessage(
        text,
        type
    ){

        messageBox.textContent =
            text;

        messageBox.className =
            "message show " + type;

    }


    /*
    ==========================================
    MOSTRAR FORMULARIO
    ==========================================
    */

    function showResetForm(){

        loadingSection.style.display =
            "none";

        resetSection.classList.add(
            "active"
        );

    }


    /*
    ==========================================
    MOSTRAR ERROR DE ENLACE
    ==========================================
    */

    function showInvalidLink(){

        loadingSection.style.display =
            "none";

        resetSection.classList.add(
            "active"
        );

        document.querySelector(
            "#resetSection h2"
        ).textContent =
            "Enlace no válido";

        document.querySelector(
            "#resetSection .description"
        ).textContent =
            "El enlace de recuperación ha caducado o ya fue utilizado.";

        document.getElementById(
            "newPassword"
        ).style.display =
            "none";

        document.getElementById(
            "confirmPassword"
        ).style.display =
            "none";

        document.querySelector(
            "#resetSection label[for='newPassword']"
        ).style.display =
            "none";

        document.querySelector(
            "#resetSection label[for='confirmPassword']"
        ).style.display =
            "none";

        saveButton.style.display =
            "none";

        showMessage(
            "Solicita un nuevo enlace de recuperación desde la página principal de SparkyKrea.",
            "error"
        );

    }


    /*
    ==========================================
    ACTUALIZAR CONTRASEÑA
    ==========================================
    */

    async function updatePassword(){

        const password =
            document
            .getElementById(
                "newPassword"
            )
            .value;

        const confirmPassword =
            document
            .getElementById(
                "confirmPassword"
            )
            .value;


        /*
        VALIDAR CONTRASEÑA
        */

        if(!password){

            showMessage(
                "Escribe una nueva contraseña.",
                "error"
            );

            return;
        }


        /*
        VALIDAR LONGITUD
        */

        if(password.length < 6){

            showMessage(
                "La contraseña debe tener al menos 6 caracteres.",
                "error"
            );

            return;
        }


        /*
        CONFIRMAR CONTRASEÑA
        */

        if(password !== confirmPassword){

            showMessage(
                "Las contraseñas no coinciden.",
                "error"
            );

            return;
        }


        /*
        DESACTIVAR BOTÓN
        */

        saveButton.disabled =
            true;

        saveButton.textContent =
            "Guardando...";


        try{

            /*
            COMPROBAR SESIÓN
            */

            const {
                data: sessionData,
                error: sessionError
            } =
            await supabaseClient
            .auth
            .getSession();


            if(sessionError){

                throw sessionError;

            }


            if(
                !sessionData ||
                !sessionData.session
            ){

                showMessage(
                    "No encontramos una sesión de recuperación. Abre nuevamente el enlace que recibiste por correo.",
                    "error"
                );

                saveButton.disabled =
                    false;

                saveButton.textContent =
                    "Guardar nueva contraseña";

                return;
            }


            /*
            ACTUALIZAR CONTRASEÑA
            */

            const {
                data,
                error
            } =
            await supabaseClient
            .auth
            .updateUser({
                password:password
            });


            if(error){

                throw error;

            }


            /*
            ÉXITO
            */

            showMessage(
                "¡Contraseña actualizada correctamente! Ya puedes volver a SparkyKrea e iniciar sesión.",
                "success"
            );


            saveButton.textContent =
                "Contraseña actualizada";


            /*
            LIMPIAR CAMPOS
            */

            document.getElementById(
                "newPassword"
            ).value = "";

            document.getElementById(
                "confirmPassword"
            ).value = "";


        }catch(error){

            console.error(
                "Error actualizando contraseña:",
                error
            );


            let errorMessage =
                "No pudimos actualizar la contraseña.";


            if(error && error.message){

                errorMessage =
                    error.message;

            }


            showMessage(
                errorMessage,
                "error"
            );


            saveButton.disabled =
                false;

            saveButton.textContent =
                "Guardar nueva contraseña";

        }

    }


    /*
    ==========================================
    EVENTO DE AUTENTICACIÓN
    ==========================================
    */

    supabaseClient
    .auth
    .onAuthStateChange(
        async (
            event,
            session
        ) => {

            console.log(
                "Supabase Auth:",
                event
            );


            /*
            CUANDO SUPABASE CONFIRMA
            QUE ES UNA RECUPERACIÓN
            */

            if(
                event ===
                "PASSWORD_RECOVERY"
            ){

                showResetForm();

                return;

            }


            /*
            SI YA EXISTE UNA SESIÓN
            */

            if(
                session &&
                session.user
            ){

                showResetForm();

            }

        }
    );


    /*
    ==========================================
    COMPROBACIÓN INICIAL
    ==========================================
    */

    async function checkRecoverySession(){

        try{

            /*
            DAR TIEMPO A SUPABASE
            PARA PROCESAR EL ENLACE
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1500
                    )
            );


            const {
                data,
                error
            } =
            await supabaseClient
            .auth
            .getSession();


            if(error){

                console.error(
                    error
                );

                showInvalidLink();

                return;

            }


            /*
            SI HAY SESIÓN,
            MOSTRAR FORMULARIO
            */

            if(
                data &&
                data.session &&
                data.session.user
            ){

                showResetForm();

                return;

            }


            /*
            SI NO HAY SESIÓN,
            REVISAR SI LA URL
            TIENE DATOS DE RECUPERACIÓN
            */

            const url =
                window.location.href;


            const hasCode =
                url.includes(
                    "?code="
                );


            const hasAccessToken =
                url.includes(
                    "access_token="
                );


            const hasTypeRecovery =
                url.includes(
                    "type=recovery"
                );


            /*
            SI TIENE PARÁMETROS
            DE RECUPERACIÓN,
            ESPERAR UN POCO MÁS
            */

            if(
                hasCode ||
                hasAccessToken ||
                hasTypeRecovery
            ){

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            2000
                        )
                );


                const {
                    data: retryData
                } =
                await supabaseClient
                .auth
                .getSession();


                if(
                    retryData &&
                    retryData.session
                ){

                    showResetForm();

                    return;

                }

            }


            /*
            NO SE ENCONTRÓ SESIÓN
            */

            showInvalidLink();


        }catch(error){

            console.error(
                "Error comprobando recuperación:",
                error
            );

            showInvalidLink();

        }

    }


    /*
    ==========================================
    INICIAR
    ==========================================
    */

    checkRecoverySession();

</script>

</body>

</html>
